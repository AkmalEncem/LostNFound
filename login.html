<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LostNFound — Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
    <style>
        .popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .popup-overlay.active {
            display: flex;
        }
    </style>
</head>
<body class="login-body">

    <a href="index.html" class="btn-back-home">
        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span> Back to Home
    </a>

    <div class="login-wrapper">
        <div class="login-header-inline">
            <div class="nav-logo-box">
                <div class="icon check-icon"></div>
                <div class="icon search-icon"></div>
            </div>
            <div class="login-brand">Lost<span>N</span>Found</div>
        </div>
        
        <div class="login-subtitle">Login to your UTHM account</div>

        <form onsubmit="loginUser(event)">
            <div class="login-form-group">
                <label>Email Address: </label>
                <input type="email" id="loginEmail" class="login-input" placeholder="no.matrix@student.uthm.edu.my" required>
            </div>
            
            <div class="login-form-group">
                <label>Password: </label>
                <div class="password-container">
                    <input type="password" id="passwordField" class="login-input" placeholder="••••••••" required>
                    <span class="material-symbols-outlined toggle-password" onclick="togglePassword()">visibility</span>
                </div>
                <div class="forgot-link-wrap">
                    <a href="forgot-password.html">Forgot Password?</a>
                </div>
            </div>

            <button type="submit" class="btn-submit-login">Login</button>
        </form>

        <div class="separator"><span>OR</span></div>

        <div class="login-footer-text">
            Don't have an account? <a href="register.html">Create an account!</a>
        </div>
    </div>

    <!-- Error Popup -->
    <div id="errorPopup" class="popup-overlay">
        <div class="popup-box error-box">
            <span class="material-symbols-outlined popup-icon error-icon">warning</span>
            <h2>Account Not Found</h2>
            <p id="errorText">
                Hmm... this account does not exist or the password is incorrect.
            </p>
            <button onclick="closePopup()">Try Again</button>
        </div>
    </div>

    <script>
        function togglePassword() {
            const field = document.getElementById('passwordField');
            const icon = document.querySelector('.toggle-password');
            if (field.type === 'password') {
                field.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                field.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        function loginUser(event) {
            event.preventDefault();

            const emailInput = document.getElementById("loginEmail").value;
            const passwordInput = document.getElementById("passwordField").value;

            // Check dari senarai semua users
            let allUsers = JSON.parse(localStorage.getItem("lostnfoundUsers")) || [];

            // Fallback: sokongan account lama (sebelum update)
            const legacyUser = JSON.parse(localStorage.getItem("lostnfoundUser"));
            if (legacyUser && allUsers.length === 0) {
                allUsers = [legacyUser];
                localStorage.setItem("lostnfoundUsers", JSON.stringify(allUsers));
            }

            const matchedUser = allUsers.find(u => u.email === emailInput && u.password === passwordInput);

            if (matchedUser) {
                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("currentUserEmail", matchedUser.email);
                localStorage.setItem("userName", matchedUser.firstName + " " + matchedUser.lastName);
                // Simpan juga untuk compatibility dengan kod lama
                localStorage.setItem("lostnfoundUser", JSON.stringify(matchedUser));
                window.location.href = "index.html";
            } else if (allUsers.length === 0) {
                showError("Account not found. Please register first.");
            } else {
                showError("Hmm.. you entered the wrong password or email.");
            }
        }

        function showError(message) {
            document.getElementById("errorText").textContent = message;
            document.getElementById("errorPopup").classList.add("active");
        }

        function closePopup() {
            document.getElementById("errorPopup").classList.remove("active");
        }
    </script>
</body>
</html>
